name: AegisContract CI & Governance Gating

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    name: Unit Tests & Governance Gating
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        run: |
          pytest -v --durations=10

      - name: Static SQL AST Contract Gating
        run: |
          python -m src.cli.main validate-sql \
            --sql demo/sample_queries/clean_fct_orders.sql \
            --contract contracts/finance/orders_v1.yaml \
            --catalog demo/catalog.json

      - name: Verify SemVer Contract Diff Classifier
        run: |
          python -m src.cli.main diff-contract \
            --old contracts/finance/orders_v1.yaml \
            --new contracts/finance/orders_v1_1_additive.yaml

      - name: Run Benchmark Chaos Suite
        run: |
          python -m demo.generate_benchmark_stream
          python -m demo.run_benchmark
